name: NexaInsight
options:
  bundleIdPrefix: com.nexainsight
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
packages:
  # Prebuilt WebRTC xcframework (binary target). Supplies the real
  # QwenRealtimeTransport path; without it the app compiles against the stub
  # in QwenRealtimeTransport.swift that throws NotIntegrated on connect.
  WebRTC:
    url: https://github.com/stasel/WebRTC.git
    exactVersion: "150.0.0"
targets:
  NexaInsight:
    type: application
    platform: iOS
    sources:
      - path: NexaInsight
    dependencies:
      - package: WebRTC
    info:
      path: NexaInsight/Info.plist
      properties:
        CFBundleDisplayName: Nexa Insight
        CFBundleName: Nexa Insight
        NSMicrophoneUsageDescription: "Nexa Insight records your shadowing practice and voice-class speech."
        NSLocalNetworkUsageDescription: "Nexa Insight connects to your development backend on the local network."
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
          NSAllowsLocalNetworking: true
          NSExceptionDomains:
            100.64.0.1:
              NSExceptionAllowsInsecureHTTPLoads: true
            mac-mini-2.tail.ganlin1981.online:
              NSExceptionAllowsInsecureHTTPLoads: true
        UILaunchScreen: {}
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
    settings:
      base:
        GENERATE_INFOPLIST_FILE: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        PRODUCT_BUNDLE_IDENTIFIER: com.nexainsight.app
        PRODUCT_NAME: Nexa Insight
        TARGETED_DEVICE_FAMILY: "1,2"
        SWIFT_VERSION: "5.9"
        # Device signing: automatic, against the one Apple Development team on
        # this machine. Team ID read from the codesigning cert (OU=CCGQFW2P89).
        DEVELOPMENT_TEAM: CCGQFW2P89
        CODE_SIGN_STYLE: Automatic
# Unit tests run via the SwiftPM package (NexaInsightCore-Package scheme),
# which already builds+tests for both macOS and the iOS simulator. This
# .xcodeproj provides the runnable/installable app bundle. Keeping the two
# separate avoids a module-name clash (tests @testable import NexaInsightCore).
